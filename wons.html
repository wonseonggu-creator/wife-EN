<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WON-GLISH">
<meta name="theme-color" content="#DB2777">
<title>WON-GLISH — 每天10分钟英语</title>
<link rel="manifest" id="mf">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFFFFF;--bg2:#FBF5F9;--bg3:#F4E9F0;
  --tx:#101828;--tx2:#5B6472;--tx3:#98A2B3;
  --line:#F0DEEA;--grad:linear-gradient(135deg,#EC4899,#8B5CF6);
  --blue:#DB2777;--blue-dk:#BE185D;--blue-bg:#FCE7F3;--blue-tx:#BE185D;
  --green:#16A34A;--green-bg:#EAF8EF;--green-tx:#15803D;
  --amber:#D97706;--amber-bg:#FEF6E7;--amber-tx:#B45309;
  --sh:0 2px 6px rgba(190,24,93,.05),0 8px 22px rgba(190,24,93,.07);
  --r:20px;--r-sm:14px;
  --f-en:'Inter','SF Pro Text',-apple-system,'Segoe UI',sans-serif;
  --f-ko:'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei','Noto Sans SC',-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#171019;--bg2:#211826;--bg3:#2C2033;
  --tx:#EDF0F4;--tx2:#9AA3B0;--tx3:#5E6875;
  --line:#352640;--grad:linear-gradient(135deg,#EC4899,#8B5CF6);
  --blue:#F472B6;--blue-dk:#DB2777;--blue-bg:#3B1830;--blue-tx:#F9A8D4;
  --green:#34C769;--green-bg:#12301D;--green-tx:#63D68D;
  --amber:#F0A23C;--amber-bg:#33230C;--amber-tx:#F3B563;
  --sh:0 1px 2px rgba(0,0,0,.4);
}}
html{font-size:16px}
body{font-family:var(--f-ko);background:radial-gradient(900px 420px at 112% -8%,var(--blue-bg) 0%,transparent 62%),radial-gradient(700px 360px at -12% -4%,rgba(139,92,246,.12) 0%,transparent 58%),var(--bg);color:var(--tx);overscroll-behavior:none;line-height:1.5}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font-family:inherit}
.en{font-family:var(--f-en)}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}

/* ── 헤더 ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(max(env(safe-area-inset-top),10px)) 20px 6px}
.logo{font-family:var(--f-en);font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo b{}
.hdr-right{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--bg2);color:var(--tx2)}
.pill.streak{background:var(--blue-bg);color:var(--blue-tx)}
.pill svg{width:14px;height:14px}

/* ── 화면 공통 ── */
.screen{display:none;padding:8px 20px 24px;animation:fadein .18s ease}
.screen.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.sec-t{font-size:13px;font-weight:700;color:var(--tx3);letter-spacing:.04em;margin:22px 0 10px}

/* ── 홈: 링 ── */
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:18px 0 8px}
.ring{position:relative;width:168px;height:168px}
.ring svg{transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--bg3);stroke-width:12}
.ring .bar{fill:none;stroke:url(#wg1);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-pct{font-family:var(--f-en);font-size:34px;font-weight:800;letter-spacing:-.03em}
.ring-lb{font-size:12px;color:var(--tx3);font-weight:600}
.today-theme{margin-top:14px;width:100%}
.tt-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.tt-day{font-family:var(--f-en);font-size:13px;font-weight:800;color:var(--blue)}
.tt-week{font-size:12px;color:var(--tx3)}
.tt-name{font-size:19px;font-weight:800;letter-spacing:-.01em}
.tt-sub{font-size:13px;color:var(--tx2);margin-top:3px}
.btn-main{display:block;width:100%;margin-top:16px;padding:16px;border-radius:16px;background:var(--grad);color:#fff;font-size:17px;font-weight:800;letter-spacing:-.01em;box-shadow:0 8px 20px rgba(219,39,119,.32);transition:transform .12s}
.btn-main:active{transform:scale(.975)}
.btn-main.done{background:var(--green);box-shadow:0 6px 16px rgba(22,163,74,.25)}
.btn-sub{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;background:var(--bg2);color:var(--tx2);font-size:15px;font-weight:700;transition:transform .12s}
.btn-sub:active{transform:scale(.975)}

/* ── 레슨 ── */
.ltop{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.lx{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--tx3);font-size:20px;flex-shrink:0}
.lx:active{background:var(--bg2)}
.ptrack{flex:1;height:12px;background:var(--bg3);border-radius:8px;overflow:hidden}
.pbar{height:100%;width:0;background:var(--grad);border-radius:8px;transition:width .35s cubic-bezier(.22,1,.36,1)}
.combo{min-width:44px;text-align:center;font-family:var(--f-en);font-size:13px;font-weight:800;padding:5px 9px;border-radius:20px;background:var(--bg2);color:var(--tx3);transition:all .2s}
.combo.hot{background:var(--blue-bg);color:var(--blue-tx)}
.qtype{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--blue-tx);background:var(--blue-bg);padding:5px 11px;border-radius:20px;margin-bottom:14px}
.qask{font-size:15px;font-weight:700;color:var(--tx2);margin-bottom:14px}
.qen{font-family:var(--f-en);font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.4;margin-bottom:6px}
.qko{font-size:17px;font-weight:600;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:15px 16px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--bg);font-size:16px;font-weight:600;line-height:1.45;transition:transform .1s,border-color .15s,background .15s}
.opt.en{font-family:var(--f-en);font-size:17px}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-tx)}
.opt.ok{border-color:var(--green);background:var(--green-bg);color:var(--green-tx)}
.opt.no{border-color:var(--amber);background:var(--amber-bg);color:var(--amber-tx)}
.spk{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:22px;background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(219,39,119,.32);transition:transform .12s;margin:4px 0 18px}
.spk:active{transform:scale(.93)}
.spk svg{width:28px;height:28px}
.spk.sm{width:40px;height:40px;border-radius:13px;margin:0;box-shadow:none;background:var(--blue-bg);color:var(--blue-tx)}
.spk.sm svg{width:19px;height:19px}

/* 플립 카드 */
.flip{perspective:900px;margin:6px 0 4px}
.flip-in{position:relative;width:100%;min-height:190px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.2,.4,1);cursor:pointer}
.flip.f .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--blue-bg);border-color:transparent}
.face .hint{font-size:12px;color:var(--tx3);font-weight:600;position:absolute;bottom:12px}
.nu{font-size:13px;color:var(--tx2);background:var(--bg);border-radius:8px;padding:6px 12px;font-weight:600}

/* 빈칸·배열·뱅크 */
.gapline{font-family:var(--f-en);font-size:22px;font-weight:700;line-height:1.6;margin-bottom:20px}
.gap{display:inline-block;min-width:74px;border-bottom:2.5px solid var(--tx3);text-align:center;color:var(--blue-tx);padding:0 6px}
.gap.fill{border-color:var(--blue)}
.bank{display:flex;flex-wrap:wrap;gap:9px}
.chip{font-family:var(--f-en);font-size:16px;font-weight:700;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);box-shadow:0 2px 0 var(--line);transition:transform .1s,opacity .15s}
.chip:active{transform:translateY(1px)}
.chip.used{opacity:.25;pointer-events:none}
.ans-row{min-height:52px;border-bottom:1.5px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 0 10px;margin-bottom:16px}
.ans-row .chip{background:var(--blue-bg);border-color:transparent;box-shadow:none;color:var(--blue-tx)}

/* 매칭 */
.match{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mbtn{padding:13px 10px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--bg);font-size:14.5px;font-weight:600;line-height:1.35;transition:all .15s;min-height:56px}
.mbtn.en{font-family:var(--f-en);font-size:15px}
.mbtn.sel{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-tx)}
.mbtn.ok{border-color:transparent;background:var(--green-bg);color:var(--green-tx);opacity:.55;pointer-events:none}
.mbtn.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 타이핑 */
.tinput{width:100%;font-family:var(--f-en);font-size:19px;font-weight:600;padding:15px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--bg);color:var(--tx);outline:none}
.tinput:focus{border-color:var(--blue)}
.hintbtn{margin-top:10px;font-size:13px;font-weight:700;color:var(--blue-tx);padding:6px 0}

/* 문법 */
.gram{border-left:4px solid var(--blue);padding-left:14px;margin:4px 0 16px}
.gram-t{font-size:18px;font-weight:800;margin-bottom:8px}
.gram-e{font-size:15px;color:var(--tx2);line-height:1.7;white-space:pre-line}
.gram-ex{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.gex{background:var(--bg2);border-radius:var(--r-sm);padding:11px 13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.gex .e{font-family:var(--f-en);font-size:15.5px;font-weight:700}
.gex .k{font-size:13px;color:var(--tx2);margin-top:2px}

/* 하단 확인/피드백 시트 */
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:30}
.sheet.ok{background:var(--green-bg);border-color:transparent}
.sheet.no{background:var(--amber-bg);border-color:transparent}
.fb-t{font-size:16px;font-weight:800;margin-bottom:2px}
.sheet.ok .fb-t{color:var(--green-tx)}
.sheet.no .fb-t{color:var(--amber-tx)}
.fb-s{font-size:14.5px;color:var(--tx2);margin-bottom:10px}
.fb-s .en{font-weight:700;color:var(--tx)}
.btn-chk{display:block;width:100%;padding:15px;border-radius:16px;font-size:16.5px;font-weight:800;background:var(--grad);color:#fff;transition:transform .1s,opacity .2s}
.btn-chk:disabled{background:var(--bg3);color:var(--tx3)}
.btn-chk:active{transform:scale(.98)}
.sheet.ok .btn-chk{background:var(--green)}
.sheet.no .btn-chk{background:var(--amber)}

/* 완료 화면 */
.doneWrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 0 10px}
.done-t{font-size:24px;font-weight:800;margin:18px 0 4px}
.done-s{font-size:15px;color:var(--tx2)}
.dstats{display:flex;gap:10px;margin-top:22px;width:100%}
.dstat{flex:1;background:var(--bg2);border-radius:var(--r-sm);padding:14px 8px}
.dstat .v{font-family:var(--f-en);font-size:22px;font-weight:800;color:var(--blue-tx)}
.dstat .l{font-size:12px;color:var(--tx3);font-weight:700;margin-top:2px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf{position:absolute;top:-12px;width:9px;height:9px;border-radius:2px;animation:fall 1.15s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}

/* 복습·나 */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;box-shadow:var(--sh)}
.stat .v{font-family:var(--f-en);font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat .v small{font-size:13px;color:var(--tx3);font-weight:700}
.stat .l{font-size:12.5px;color:var(--tx3);font-weight:700;margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.cd{aspect-ratio:1;border-radius:11px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-en);font-size:13px;font-weight:700;color:var(--tx3);background:var(--bg)}
.cd.done{background:var(--blue);border-color:transparent;color:#fff}
.cd.today{border:2px solid var(--blue);color:var(--blue-tx)}
.cd.lock{opacity:.45}
.weak{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.weak .e{font-family:var(--f-en);font-size:15.5px;font-weight:700}
.weak .k{font-size:13px;color:var(--tx2);margin-top:1px}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:12px;background:var(--amber-bg);color:var(--amber-tx);flex-shrink:0}
.gitem{padding:12px 0;border-bottom:1px solid var(--line)}
.gitem .h{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700}
.gitem .h span{color:var(--tx3);font-size:12px;font-family:var(--f-en)}
.gitem .b{display:none;font-size:14px;color:var(--tx2);line-height:1.65;margin-top:8px;white-space:pre-line}
.gitem.open .b{display:block}

/* 설정 */
.setrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.setrow .d{font-size:12.5px;color:var(--tx3);font-weight:500;margin-top:2px}
.sw{position:relative;width:48px;height:28px;border-radius:20px;background:var(--bg3);transition:background .2s;flex-shrink:0}
.sw.on{background:var(--blue)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on::after{left:23px}
.sinput{width:150px;font-size:13px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);outline:none;text-align:right}
.btn-line{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1.5px solid var(--line);font-size:14.5px;font-weight:700;color:var(--tx2);transition:transform .1s}
.btn-line:active{transform:scale(.98)}
.btn-line.warn{color:var(--amber-tx);border-color:var(--amber-bg)}

/* 탭바 */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:11px;font-weight:700;color:var(--tx3);transition:color .15s}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--blue)}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-70px);background:var(--tx);color:var(--bg);font-size:14px;font-weight:700;padding:11px 20px;border-radius:24px;z-index:60;transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:0 8px 22px rgba(0,0,0,.22);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,.sw:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}

/* ── 응원단 (딸들) ── */
.cheer{position:fixed;right:8px;bottom:146px;z-index:35;display:flex;align-items:flex-end;gap:6px;pointer-events:none;opacity:0;transform:translateY(14px);transition:opacity .22s,transform .25s cubic-bezier(.22,1,.36,1)}
.cheer.show{opacity:1;transform:none}
.ch-col{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.ch-face{width:76px;height:76px;border-radius:50%;border:3.5px solid #fff;box-shadow:0 6px 16px rgba(16,24,40,.25);overflow:hidden;background:var(--blue-bg);flex-shrink:0}
.ch-face img,.ch-face svg{width:100%;height:100%;object-fit:cover;display:block}
.ch-face img{filter:saturate(1.05)}
.ch-name{font-size:11.5px;font-weight:800;color:#fff;background:var(--blue);padding:2px 10px;border-radius:10px;white-space:nowrap}
.ch-char{width:150px;height:auto;display:block;transform-origin:50% 62%;filter:drop-shadow(0 6px 12px rgba(16,24,40,.22))}
.ch-bub{max-width:215px;background:var(--bg);border:1.5px solid var(--line);border-radius:16px 16px 3px 16px;padding:10px 13px;font-size:14.5px;font-weight:700;box-shadow:var(--sh);margin-bottom:26px}
/* ── 캐릭터 파츠 상시 애니메이션 ── */
#q-area{padding-bottom:205px}
.ch-char .pt,.ch-char .cg-all{transform-box:view-box}
.cg-armL{transform-origin:40px 84px}
.cg-armR{transform-origin:80px 84px}
.cg-head{transform-origin:60px 60px}
.cg-legL{transform-origin:48px 112px}
.cg-legR{transform-origin:72px 112px}
.cg-all{transform-origin:60px 105px}
.cheer .ch-bub{animation:chPop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes chPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes chJump{0%,100%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-20px) scale(.94,1.06)}70%{transform:translateY(0) scale(1.07,.93)}}
/* 대기 — 항상 꼼지락 */
.ch-idle .cg-all{animation:iBob 1.4s ease-in-out infinite}
@keyframes iBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(.99,1.01)}}
.ch-idle .cg-armL{animation:iArmL 1.4s ease-in-out infinite}
.ch-idle .cg-armR{animation:iArmR 1.4s ease-in-out infinite}
@keyframes iArmL{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(16deg)}}
@keyframes iArmR{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-16deg)}}
.ch-idle .cg-head{animation:iHead 3.4s ease-in-out infinite}
@keyframes iHead{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.ch-idle .cg-legL{animation:iLeg 1.4s ease-in-out infinite}
.ch-idle .cg-legR{animation:iLeg 1.4s ease-in-out infinite .7s}
@keyframes iLeg{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
/* 재롱 (5초마다 랜덤) */
.f-jump .cg-all{animation:chJump .45s ease 2}
.f-jump .cg-armL{animation:aUpL .45s ease 2}
.f-jump .cg-armR{animation:aUpR .45s ease 2}
.f-spin .cg-all{animation:rSpin .9s cubic-bezier(.4,.1,.3,1.15)}
.f-wave .cg-armR{animation:aWaveR .3s ease-in-out 4}
.f-wiggle .cg-all{animation:rHips .3s ease-in-out 4}
/* 공용 파츠 키프레임 */
@keyframes aUpL{0%,100%{transform:rotate(0)}50%{transform:rotate(-150deg)}}
@keyframes aUpR{0%,100%{transform:rotate(0)}50%{transform:rotate(150deg)}}
@keyframes aHoldL{to{transform:rotate(-145deg)}}
@keyframes aHoldR{to{transform:rotate(145deg)}}

<script>
"use strict";
/* ───────── 헬퍼 ───────── */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const escH=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}

/* ───────── 사운드 엔진 (Web Audio 합성 — 파일 없음) ───────── */
const FX={
  ctx:null,bgmGain:null,bgmTimer:null,
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},
  resume(){this.init();if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume()},
  t(freq,start,dur,type,vol,slide){ // 단일 톤
    if(!this.ctx||!S.set.sfx)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain(),n=this.ctx.currentTime+start;
    o.type=type||"sine";o.frequency.setValueAtTime(freq,n);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,n+dur);
    g.gain.setValueAtTime(0.0001,n);
    g.gain.exponentialRampToValueAtTime(vol||0.14,n+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,n+dur);
    o.connect(g).connect(this.ctx.destination);o.start(n);o.stop(n+dur+0.05);
  },
  correct(){this.resume();this.t(523.25,0,.14,"sine",.15);this.t(659.25,.07,.2,"sine",.15)},
  combo(n){this.resume();const base=523.25*Math.pow(1.06,Math.min(n,12));[0,4,7,12].forEach((st,i)=>this.t(base*Math.pow(2,st/12),i*.06,.16,"sine",.13))},
  wrong(){this.resume();this.t(196,0,.22,"triangle",.1);this.t(174.6,.1,.26,"triangle",.08)},
  tap(){this.resume();this.t(760,0,.05,"square",.05)},
  flip(){this.resume();this.t(320,0,.14,"sine",.07,640)},
  match(){this.resume();this.t(880,0,.07,"sine",.1);this.t(1318.5,.06,.12,"sine",.1)},
  bell(){this.resume();this.t(1568,0,.7,"sine",.12);this.t(2093,.02,.55,"sine",.05)},
  fanfare(){this.resume();const m=[[392,0],[523.25,.11],[659.25,.22],[783.99,.33],[1046.5,.5]];m.forEach(([f,d])=>this.t(f,d,.28,"triangle",.13));this.t(1046.5,.5,.55,"sine",.1)},
  streak(){this.resume();[659.25,783.99,987.77,1318.5].forEach((f,i)=>this.t(f,i*.09,.22,"sine",.12))},
  /* 배경음: 로파이풍 코드 패드 루프 */
  bgmStart(){
    this.resume();if(!this.ctx||this.bgmTimer)return;
    this.bgmGain=this.ctx.createGain();this.bgmGain.gain.value=0.045;
    const lp=this.ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;
    this.bgmGain.connect(lp).connect(this.ctx.destination);
    const chords=[[261.63,329.63,392,493.88],[220,261.63,329.63,415.3],[174.61,220,261.63,349.23],[196,246.94,293.66,392]];
    let ci=0;
    const play=()=>{
      const ch=chords[ci%chords.length];ci++;
      ch.forEach((f,i)=>{
        const o=this.ctx.createOscillator(),g=this.ctx.createGain(),n=this.ctx.currentTime;
        o.type=i%2?"triangle":"sine";o.frequency.value=f*(i===3?0.5:1);
        o.detune.value=(Math.random()*8-4);
        g.gain.setValueAtTime(0.0001,n);g.gain.linearRampToValueAtTime(0.22,n+1.2);
        g.gain.linearRampToValueAtTime(0.0001,n+3.8);
        o.connect(g).connect(this.bgmGain);o.start(n);o.stop(n+4);
      });
    };
    play();this.bgmTimer=setInterval(play,3600);
  },
  bgmStop(){if(this.bgmTimer){clearInterval(this.bgmTimer);this.bgmTimer=null}if(this.bgmGain){try{this.bgmGain.disconnect()}catch(e){}this.bgmGain=null}},
  duck(on){if(this.bgmGain&&this.ctx)this.bgmGain.gain.linearRampToValueAtTime(on?0.012:0.045,this.ctx.currentTime+0.25)}
};
function vib(p){if(!S.set.vib)return;
  if(navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}
  else if(window.AndroidTTS&&AndroidTTS.vibrate){try{AndroidTTS.vibrate(Array.isArray(p)?p.reduce((a,b)=>a+b,0):p)}catch(e){}}}

/* ───────── TTS ───────── */
let VOICE=null;
function pickVoice(){
  if(!window.speechSynthesis)return;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.startsWith("en"));
  VOICE=vs.find(v=>/en[-_]US/i.test(v.lang)&&/female|samantha|aria|jenny|zira/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,btn){
  if(window.AndroidTTS){ // APK: 네이티브 TTS 브리지
    FX.duck(true);if(btn)btn.style.opacity=".55";
    window._ttsEnd=()=>{FX.duck(false);if(btn)btn.style.opacity=""};
    try{AndroidTTS.speak(text,S.set.rate)}catch(e){window._ttsEnd()}
    return;
  }
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";u.rate=S.set.rate;if(VOICE)u.voice=VOICE;
  u.onstart=()=>{FX.duck(true);if(btn)btn.style.opacity=".55"};
  u.onend=u.onerror=()=>{FX.duck(false);if(btn)btn.style.opacity=""};
  speechSynthesis.speak(u);
}

x:[["I've lived here for ten years.","我在这儿住了十年。"],["She's been sick since Friday.","她从周五一直病到现在。"]],

["It stopped working after two days.","用了两天就坏了。","stop ~ing = 不再~"],

x:[["If it's too expensive, I won't buy it.","太贵我就不买。"],["I'll call you if I'm late.","我要是晚了就给你打电话。"]],

];
const STOP=new Set(["i","a","an","the","to","at","in","on","is","am","are","my","me","it","this","that","for","you","do","we","of","and","its","was","im","ill","id"]);
function keyWord(en){ // 빈칸으로 뚫을 핵심 단어
  const ws=en.replace(/[.!?,]/g,"").split(" ");
  let best="",bi=0;
  ws.forEach((w,i)=>{const c=w.toLowerCase().replace(/'/g,"");if(!STOP.has(c)&&w.length>=best.length){best=w;bi=i}});
  if(!best)ws.forEach((w,i)=>{if(w.length>=best.length){best=w;bi=i}}); // 전부 스톱워드면 최장 단어
  return{word:best,idx:bi};
}
const EID=(d,i)=>d+"-"+i;
const EXP=id=>{const[d,i]=id.split("-").map(Number);return DATA[d-1].p[i]};
const ALL_IDS=[];DATA.forEach(dd=>dd.p.forEach((_,i)=>ALL_IDS.push(EID(dd.d,i))));

<script>
/* ───────── 상태 ───────── */
const DEF={day:1,xp:0,streak:0,lastDone:"",freeze:0,done:[],cards:{},revC:0,revW:0,
  today:{date:"",ans:0,total:0,comp:false},
  set:{sfx:1,bgm:0,vib:1,rate:0.95,compact:0,srv:"",cheer:1,toon:0},
  girls:[{n:"大女儿",img:""},{n:"小女儿",img:""}],saved:0};
let S=load();
function load(){
  try{const j=JSON.parse(localStorage.getItem("wonshw")||"null");
    if(j){const s=Object.assign({},DEF,j);s.set=Object.assign({},DEF.set,j.set||{});s.today=Object.assign({},DEF.today,j.today||{});if(!Array.isArray(s.girls)||s.girls.length!==2)s.girls=JSON.parse(JSON.stringify(DEF.girls));return s}
  }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function save(){S.saved=Date.now();try{localStorage.setItem("wonshw",JSON.stringify(S))}catch(e){}}

/* ───────── SRS (간격 반복) ───────── */
const INT=[0,1,3,7,16,35];
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function srsUpdate(id,ok){
  const c=S.cards[id]||{b:1,due:todayStr(),c:0,w:0};
  if(ok){c.c++;c.b=Math.min(c.b+1,5);c.due=addDays(INT[c.b]);S.revC++}
  else{c.w++;c.b=1;c.due=addDays(1);S.revW++}
  S.cards[id]=c;
}
function dueIds(){const t=todayStr();return Object.keys(S.cards).filter(id=>S.cards[id].due<=t)}
function ladder(id){
  const b=(S.cards[id]||{b:1}).b;
  if(b<=2)return["mean","listen","blank"];
  if(b<=4)return["arrange","blank"];
  return["type"];
}

/* ───────── 레슨 엔진 ───────── */
let L=null;
const TYPE_LB={flip:"新表达",mean:"选意思",listen:"听力选择",blank:"填空",arrange:"连词成句",match:"配对",type:"写英文",gram:"今日语法",gq:"语法小测"};
function rot(pool,prev){const c=pool.filter(t=>t!==prev);return c[Math.floor(Math.random()*c.length)]}
function canListen(){return !!(window.AndroidTTS||window.speechSynthesis)}

function buildDaily(){
  const day=DATA[S.day-1],newIds=day.p.map((_,i)=>EID(S.day,i)),steps=[];
  const compact=S.set.compact;
  // 1 워밍업 — 밀린 복습
  const due=shuffle(dueIds().filter(id=>!newIds.includes(id))).slice(0,compact?2:3);
  let prev="";
  due.forEach(id=>{const tp=rot(ladder(id),prev);prev=tp;steps.push({k:"q",tp:tp==="listen"&&!canListen()?"mean":tp,id,srs:1})});
  // 2 새 표현 도입
  newIds.forEach(id=>steps.push({k:"flip",id}));
  // 3 연습 A — 인식형
  prev="";
  shuffle(newIds).slice(0,compact?5:10).forEach(id=>{let tp=rot(canListen()?["mean","listen","blank"]:["mean","blank"],prev);prev=tp;steps.push({k:"q",tp,id})});
  // 4 짝 맞추기
  if(!compact)steps.push({k:"match",ids:shuffle(newIds).slice(0,5)});
  // 5 연습 B — 회상형
  prev="match";
  shuffle(newIds).slice(0,compact?5:10).forEach((id,i)=>{let tp=i===0?"arrange":rot(["blank","arrange","type"],prev);prev=tp;steps.push({k:"q",tp,id})});
  // 6 오늘의 문법
  steps.push({k:"gram"},{k:"gq"});
  return steps;
}
function startLesson(){
  if(S.day>DATA.length){toast("第1~4周完成!Phase 2内容即将推出 — 请先复习");return}
  FX.resume();if(S.set.bgm)FX.bgmStart();
  L={steps:buildDaily(),i:0,ok:0,no:0,combo:0,best:0,xp:0,redoDone:{},review:false};
  S.today={date:todayStr(),ans:0,total:L.steps.filter(s=>s.k!=="gram").length,comp:S.today.date===todayStr()?S.today.comp:false};
  go("lesson");renderStep();
}
function startReview(){
  const due=shuffle(dueIds());
  if(!due.length){toast("现在没有可复习的卡片");return}
  FX.resume();if(S.set.bgm)FX.bgmStart();
  const steps=[];let prev="";
  due.slice(0,15).forEach(id=>{const tp=rot(ladder(id),prev);prev=tp;steps.push({k:"q",tp:tp==="listen"&&!canListen()?"mean":tp,id,srs:1})});
  L={steps,i:0,ok:0,no:0,combo:0,best:0,xp:0,redoDone:{},review:true};
  go("lesson");renderStep();
}
function quitLesson(){if(window.AndroidTTS)try{AndroidTTS.stop()}catch(e){};if(window.speechSynthesis)speechSynthesis.cancel();FX.bgmStop();L=null;hideSheet();chHide();go("home")}

function renderStep(){
  const st=L.steps[L.i];
  if(!st){finishLesson();return}
  $("#pbar").style.width=(L.i/L.steps.length*100)+"%";
  const cb=$("#combo");
  cb.textContent=L.combo>=2?"×"+L.combo:"—";
  cb.classList.toggle("hot",L.combo>=3);
  hideSheet();
  const R={flip:rFlip,q:rQ,match:rMatch,gram:rGram,gq:rGQ};
  R[st.k](st);
  chEnsure();
}
function next(){L.i++;renderStep()}

/* ─── 피드백 시트 ─── */
function sheetCheck(label,enabled){
  const s=$("#sheet");s.style.display="block";s.className="sheet";
  s.innerHTML='<button class="btn-chk" id="chk" '+(enabled?"":"disabled")+' onclick="doCheck()">'+label+"</button>";
}
function chkEnable(){const b=$("#chk");if(b)b.disabled=false}
function sheetFeedback(ok,en,ko,extra){
  const s=$("#sheet");s.style.display="block";s.className="sheet "+(ok?"ok":"no");
  s.innerHTML='<div class="fb-t">'+(ok?comboMsg():"差一点!正确答案是:")+'</div>'
    +(en?'<div class="fb-s"><span class="en">'+escH(en)+'</span>'+(ko?' — '+escH(ko):'')+'</div>':'<div style="height:6px"></div>')
    +(extra||"")
    +'<button class="btn-chk" onclick="next()">继续</button>';
}
function hideSheet(){const s=$("#sheet");s.style.display="none";s.innerHTML=""}
function comboMsg(){
  if(L.combo>=10)return"完美!连续 ×"+L.combo+"!";
  if(L.combo>=5)return"太厉害了!连续 ×"+L.combo+"!";
  if(L.combo>=3)return"真不错!连续 ×"+L.combo+"!";
  return["答对了!","正确!","真棒!"][Math.floor(Math.random()*3)];
}
/* 채점 공통 */
function grade(ok,st,en,ko){
  S.today.ans++;
  if(ok){
    L.ok++;L.combo++;L.best=Math.max(L.best,L.combo);
    const bonus=L.combo>=5?5:L.combo>=3?2:0;
    L.xp+=10+bonus;
    if(L.combo>=3){FX.combo(L.combo)}else{FX.correct()}
    vib(20);
  }else{
    L.no++;L.combo=0;FX.wrong();vib([40,60,40]);
    if(st&&st.id)L.steps.push({k:"q",tp:"mean",id:st.id,redo:1,srs:st.srs}) // 맞힐 때까지 재출제
  }
  if(st&&st.srs&&st.id)srsUpdate(st.id,ok);
  save();
  sheetFeedback(ok,en,ko);
  cheer(ok);
}

/* ───────── 문항 렌더러 ───────── */
let CUR=null;
function qHead(tp){return '<div class="qtype">'+TYPE_LB[tp]+'</div>'}

/* ① 카드 플립 */
function rFlip(st){
  const p=EXP(st.id);
  $("#q-area").innerHTML=qHead("flip")
   +'<div class="qask">点卡片查看意思</div>'
   +'<div class="flip" id="fc"><div class="flip-in">'
   +'<div class="face"><div class="qen">'+escH(p[0])+'</div><button class="spk sm" onclick="event.stopPropagation();speak(CUR.en,this)">'+SPK_SVG+'</button><div class="hint">点击翻面</div></div>'
   +'<div class="face back"><div class="qko">'+escH(p[1])+'</div><div class="nu">'+escH(p[2])+'</div><div class="hint">再点回到英文</div></div>'
   +'</div></div>';
  CUR={en:p[0]};
  $("#fc").onclick=()=>{FX.flip();$("#fc").classList.toggle("f")};
  speak(p[0]);
  const s=$("#sheet");s.style.display="block";s.className="sheet";

}

/* ②③ 선택형 (뜻 고르기 / 듣고 고르기) + ④⑤⑦은 아래 */
function rQ(st){
  const p=EXP(st.id);
  if(st.tp==="mean")return rMean(st,p);
  if(st.tp==="listen")return rListen(st,p);
  if(st.tp==="blank")return rBlank(st,p);
  if(st.tp==="arrange")return rArr(st,p);
  if(st.tp==="type")return rType(st,p);
}
function optHTML(list,en){
  return '<div class="opts">'+list.map((o,i)=>'<button class="opt'+(en?" en":"")+'" data-i="'+i+'" onclick="pickOpt(this)">'+escH(o)+'</button>').join("")+"</div>";
}
function pickOpt(el){
  FX.tap();
  document.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  el.classList.add("sel");CUR.sel=+el.dataset.i;chkEnable();
}
function rMean(st,p){
  const wrong=shuffle(ALL_IDS.filter(id=>id!==st.id)).slice(0,3).map(id=>EXP(id)[1]);
  const opts=shuffle([p[1],...wrong]);
  CUR={st,p,opts,ans:opts.indexOf(p[1]),sel:-1,mode:"opt"};
  $("#q-area").innerHTML=qHead("mean")+'<div class="qask">选出正确的意思</div>'
   +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px"><button class="spk sm" onclick="speak(CUR.p[0],this)">'+SPK_SVG+'</button><div class="qen" style="margin:0">'+escH(p[0])+'</div></div>'
   +optHTML(opts,false);
  sheetCheck("检查",false);
}
function rListen(st,p){
  const pool=shuffle(ALL_IDS.filter(id=>id!==st.id&&Math.abs(EXP(id)[0].length-p[0].length)<14)).slice(0,3).map(id=>EXP(id)[0]);
  while(pool.length<3)pool.push(EXP(shuffle(ALL_IDS.filter(id=>id!==st.id))[0])[0]);
  const opts=shuffle([p[0],...pool.slice(0,3)]);
  CUR={st,p,opts,ans:opts.indexOf(p[0]),sel:-1,mode:"opt"};
  $("#q-area").innerHTML=qHead("listen")+'<div class="qask">听录音,选出你听到的句子</div>'
   +'<div style="text-align:center"><button class="spk" onclick="speak(CUR.p[0],this)">'+SPK_SVG+'</button></div>'
   +optHTML(opts,true);
  sheetCheck("检查",false);
  setTimeout(()=>speak(p[0]),250);
}
/* ④ 빈칸 */
function rBlank(st,p){
  const kw=keyWord(p[0]);
  const ws=p[0].split(" ");
  const line=ws.map((w,i)=>i===kw.idx?'<span class="gap" id="gap">&nbsp;</span>'+(w.match(/[.!?,]$/)?w.slice(-1):""):escH(w)).join(" ");
  const others=shuffle(ALL_IDS.filter(id=>id!==st.id)).map(id=>keyWord(EXP(id)[0]).word.replace(/[.!?,]/g,""));
  const distract=[...new Set(others.filter(w=>w.toLowerCase()!==kw.word.toLowerCase().replace(/[.!?,]/g,"")))].slice(0,3);
  const clean=kw.word.replace(/[.!?,]/g,"");
  const bank=shuffle([clean,...distract]);
  CUR={st,p,ans:clean,sel:"",mode:"blank"};
  $("#q-area").innerHTML=qHead("blank")+'<div class="qask">选择填入空格的单词 <span style="color:var(--tx3)">— '+escH(p[1])+'</span></div>'
   +'<div class="gapline">'+line+'</div>'
   +'<div class="bank">'+bank.map(w=>'<button class="chip" onclick="fillGap(this)">'+escH(w)+'</button>').join("")+'</div>';
  sheetCheck("检查",false);
}
function fillGap(el){
  FX.tap();
  document.querySelectorAll(".bank .chip").forEach(c=>c.classList.remove("used"));
  el.classList.add("used");
  CUR.sel=el.textContent;
  const g=$("#gap");g.textContent=CUR.sel;g.classList.add("fill");
  chkEnable();
}
/* ⑤ 문장 배열 */
function rArr(st,p){
  const ws=p[0].replace(/[.!?]$/,"").split(" ");
  CUR={st,p,ws,picked:[],mode:"arr"};
  $("#q-area").innerHTML=qHead("arrange")+'<div class="qask">按顺序点单词,组成句子</div>'
   +'<div class="qko" style="margin-bottom:16px">'+escH(p[1])+'</div>'
   +'<div class="ans-row" id="arow"></div>'
   +'<div class="bank" id="abank">'+shuffle(ws.map((w,i)=>({w,i}))).map(o=>'<button class="chip" data-i="'+o.i+'" onclick="tileTap(this)">'+escH(o.w)+'</button>').join("")+'</div>';
  sheetCheck("检查",false);
}
function tileTap(el){
  FX.tap();
  const bank=el.parentElement.id==="abank";
  if(bank){
    CUR.picked.push(+el.dataset.i);el.classList.add("used");
    const c=document.createElement("button");c.className="chip";c.dataset.i=el.dataset.i;c.textContent=el.textContent;c.onclick=()=>tileBack(c);
    $("#arow").appendChild(c);
  }
  const left=document.querySelectorAll("#abank .chip:not(.used)").length;
  const b=$("#chk");if(b)b.disabled=left>0;
}
function tileBack(c){
  FX.tap();
  CUR.picked=CUR.picked.filter(i=>i!==+c.dataset.i);
  document.querySelector('#abank .chip[data-i="'+c.dataset.i+'"]').classList.remove("used");
  c.remove();
  const b=$("#chk");if(b)b.disabled=true;
}
/* ⑦ 한→영 쓰기 */
function rType(st,p){
  CUR={st,p,mode:"type",hint:0};
  $("#q-area").innerHTML=qHead("type")+'<div class="qask">看中文写出英文</div>'
   +'<div class="qko" style="margin-bottom:16px">'+escH(p[1])+'</div>'
   +'<input class="tinput en" id="tin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入英文...">'
   +'<button class="hintbtn" onclick="typeHint()">看提示</button><span id="thint" style="font-size:13px;color:var(--tx3)"></span>';
  const inp=$("#tin");
  inp.oninput=()=>{const b=$("#chk");if(b)b.disabled=inp.value.trim().length===0};
  inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim())doCheck()};
  sheetCheck("检查",false);
  setTimeout(()=>inp.focus(),150);
}
function typeHint(){
  const ws=CUR.p[0].split(" ");CUR.hint=Math.min(CUR.hint+1,2);
  $("#thint").textContent="  "+ws.slice(0,CUR.hint).join(" ")+" ...";
}
function norm(s){return s.toLowerCase().replace(/[.!?,']/g,"").replace(/\s+/g," ").trim()}
function normLoose(s){
  const M={"im":"i am","dont":"do not","doesnt":"does not","didnt":"did not","cant":"cannot","isnt":"is not","arent":"are not","havent":"have not","hasnt":"has not","couldnt":"could not","wouldnt":"would not","youre":"you are","theyre":"they are","thats":"that is","whats":"what is","lets":"let us","i'm":"i am","it's":"it is","that's":"that is","there's":"there is","i'd":"i would","i'll":"i will","i've":"i have","you're":"you are","don't":"do not","doesn't":"does not","didn't":"did not","can't":"cannot","won't":"will not","let's":"let us","what's":"what is","how's":"how is","he's":"he is","she's":"she is","we're":"we are","they're":"they are","isn't":"is not","aren't":"are not","haven't":"have not","hasn't":"has not","couldn't":"could not","wouldn't":"would not","you'd":"you would","you'll":"you will","we'll":"we will"};
  return s.toLowerCase().replace(/[.!?,]/g," ").split(/\s+/).filter(Boolean).map(w=>M[w]||w).join(" ");
}
function wordsOK(aw,tw){ // 단어 단위 비교 — 짧은 문법 단어는 정확히, 긴 단어만 오타 1자 허용
  if(aw.length!==tw.length)return false;
  let typos=0;
  for(let i=0;i<aw.length;i++){
    if(aw[i]===tw[i])continue;
    if(aw[i].length>=5&&tw[i].length>=5&&lev(aw[i],tw[i])<=1&&++typos<=2)continue;
    return false;
  }
  return true;
}
function typeOK(ans,target){
  const A=normLoose(ans).split(" "),T=normLoose(target).split(" ");
  if(wordsOK(A,T))return true;
  const st=w=>!["a","an","the","please"].includes(w);
  return wordsOK(A.filter(st),T.filter(st));
}
async function aiCheck(v,c){
  const u=srvUrl();
  if(u){
    const b=$("#chk");if(b){b.disabled=true;b.textContent="AI 判定中...";}
    try{
      const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),7000);
      const r=await fetch(u+"/api/check",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({meaning:c.p[1],target:c.p[0],answer:v}),signal:ctl.signal});
      clearTimeout(tm);
      const j=await r.json();
      if(j&&(j.ok===true||j.ok===false)){
        grade(j.ok,c.st,c.p[0],c.p[1]);if(j.ok)speak(c.p[0]);
        const btn=document.querySelector("#sheet .btn-chk");
        if(btn&&j.why)btn.insertAdjacentHTML("beforebegin",'<div class="fb-s">AI: '+escH(j.why)+'</div>');
        return;
      }
    }catch(e){}
  }
  grade(false,c.st,c.p[0],c.p[1]);
}
function lev(a,b){
  const m=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];
}
/* ⑥ 짝 맞추기 */
function rMatch(st){
  const pairs=st.ids.map(id=>({id,en:EXP(id)[0],ko:EXP(id)[1]}));
  CUR={st,pairs,selE:null,selK:null,left:pairs.length,mode:"match"};
  const ens=shuffle(pairs.map((p,i)=>({t:p.en,i})));
  const kos=shuffle(pairs.map((p,i)=>({t:p.ko,i})));
  let html=qHead("match")+'<div class="qask">把英文和意思配对</div><div class="match">';
  for(let r=0;r<pairs.length;r++){
    html+='<button class="mbtn en" data-side="e" data-i="'+ens[r].i+'" onclick="mTap(this)">'+escH(ens[r].t)+'</button>';
    html+='<button class="mbtn" data-side="k" data-i="'+kos[r].i+'" onclick="mTap(this)">'+escH(kos[r].t)+'</button>';

function mTap(el){
  FX.tap();
  const side=el.dataset.side;
  document.querySelectorAll('.mbtn[data-side="'+side+'"]').forEach(b=>b.classList.remove("sel"));
  el.classList.add("sel");
  if(side==="e")CUR.selE=el;else CUR.selK=el;
  if(CUR.selE&&CUR.selK){
    if(CUR.selE.dataset.i===CUR.selK.dataset.i){
      FX.match();vib(15);
      CUR.selE.classList.remove("sel");CUR.selK.classList.remove("sel");
      CUR.selE.classList.add("ok");CUR.selK.classList.add("ok");
      CUR.left--;
      if(CUR.left===0){grade(true,CUR.st,null,null)}
    }else{
      FX.wrong();vib(60);
      CUR.selE.classList.add("shake");CUR.selK.classList.add("shake");
      const a=CUR.selE,b=CUR.selK;
      setTimeout(()=>{a.classList.remove("sel","shake");b.classList.remove("sel","shake")},320);
    }
    CUR.selE=null;CUR.selK=null;
  }
}
/* 확인 버튼 채점 */
function doCheck(){
  const c=CUR;if(!c)return;
  if(c.mode==="opt"){
    const ok=c.sel===c.ans;
    document.querySelectorAll(".opt").forEach((o,i)=>{if(i===c.ans)o.classList.add("ok");else if(i===c.sel&&!ok)o.classList.add("no")});
    grade(ok,c.st,c.p[0],c.p[1]);if(ok&&c.st.tp==="mean")speak(c.p[0]);
  }else if(c.mode==="blank"){
    const ok=norm(c.sel)===norm(c.ans);
    const g=$("#gap");g.style.color=ok?"var(--green-tx)":"var(--amber-tx)";
    grade(ok,c.st,c.p[0],c.p[1]);if(ok)speak(c.p[0]);
  }else if(c.mode==="arr"){
    const made=c.picked.map(i=>c.ws[i]).join(" ");
    const ok=norm(made)===norm(c.p[0]);
    grade(ok,c.st,c.p[0],c.p[1]);if(ok)speak(c.p[0]);
  }else if(c.mode==="type"){
    const v=$("#tin").value;
    if(typeOK(v,c.p[0])){grade(true,c.st,c.p[0],c.p[1]);speak(c.p[0]);}
    else aiCheck(v,c);
  }else if(c.mode==="gq"){
    const ok=c.sel===c.ans;
    document.querySelectorAll(".opt").forEach((o,i)=>{if(i===c.ans)o.classList.add("ok");else if(i===c.sel&&!ok)o.classList.add("no")});
    gradeG(ok);
  }
}

function finishLesson(){
  FX.bgmStop();hideSheet();chHide();
  $("#pbar").style.width="100%";
  const wasReview=L.review,acc=L.ok+L.no?Math.round(L.ok/(L.ok+L.no)*100):100;
  S.xp+=L.xp;
  let streakMsg="";
  if(!wasReview){
    const t=todayStr();
    if(S.lastDone!==t){
      const y=addDays(-1);
      if(S.lastDone===y){S.streak++}
      else if(S.lastDone&&S.freeze>0){S.freeze--;S.streak++;streakMsg="用掉1张冻结卡 — 连续记录保住了!"}
      else S.streak=1;
      S.lastDone=t;
      if(S.streak>0&&S.streak%7===0){S.freeze++;streakMsg="达成7天!冻结卡 +1"}
    }
    if(!S.done.includes(S.day))S.done.push(S.day);
    // 새 표현 SRS 등록
    DATA[S.day-1].p.forEach((_,i)=>{const id=EID(S.day,i);if(!S.cards[id])S.cards[id]={b:1,due:addDays(1),c:0,w:0}});
    S.today.comp=true;S.today.ans=S.today.total;
    S.day=Math.min(S.day+1,DATA.length+1);
  }
  save();syncUp(true);
  $("#q-area").innerHTML='<div class="doneWrap">'
   +'<div class="ring"><svg width="168" height="168" viewBox="0 0 168 168"><circle class="track" cx="84" cy="84" r="74"></circle><circle class="bar" id="dring" cx="84" cy="84" r="74" stroke-dasharray="465" stroke-dashoffset="465" style="stroke:var(--green)"></circle></svg>'
   +'<div class="ring-c"><div class="ring-pct" style="color:var(--green-tx)">100%</div><div class="ring-lb">'+(wasReview?"复习完成":"今天完成")+'</div></div></div>'
   +'<div class="done-t">'+(wasReview?"复习完成!":"今天的学习完成了!")+'</div>'
   +'<div class="done-s">'+(streakMsg||(wasReview?"薄弱的卡片又变牢固了":"明天这个时间再见"))+'</div>'
   +'<div class="dstats">'
   +'<div class="dstat"><div class="v">+'+L.xp+'</div><div class="l">XP</div></div>'
   +'<div class="dstat"><div class="v">'+acc+'%</div><div class="l">正确率</div></div>'
   +'<div class="dstat"><div class="v">×'+L.best+'</div><div class="l">最高连击</div></div>'
   +'</div>'
   +'<button class="btn-main" style="margin-top:24px" onclick="quitLesson()">回到首页</button></div>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const r=$("#dring");if(r)r.style.strokeDashoffset="0"}));
  if(streakMsg&&streakMsg.includes("7天")){FX.streak();setTimeout(()=>FX.fanfare(),500)}else FX.fanfare();
  vib([30,50,30,50,80]);
  confetti();
  cheerFinish();
  L=null;
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const w=document.createElement("div");w.className="confetti";
  const cols=["#EC4899","#F472B6","#8B5CF6","#FBBF24","#34D399"];
  for(let i=0;i<44;i++){
    const c=document.createElement("div");c.className="cf";

}

function boxBlur(p,w,h){ // 3x3 평균 블러 (피부 매끈)
  const o=new Uint8ClampedArray(p.length);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let r=0,g=0,b=0,n=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const yy=y+dy,xx=x+dx;
      if(yy<0||yy>=h||xx<0||xx>=w)continue;
      const j=(yy*w+xx)*4;r+=p[j];g+=p[j+1];b+=p[j+2];n++;
    }
    const k=(y*w+x)*4;o[k]=r/n;o[k+1]=g/n;o[k+2]=b/n;o[k+3]=255;
  }
  return o;
}
function toonify(ctx,w,h){ // 만화풍: 색 단순화 + 검은 외곽선
  const im=ctx.getImageData(0,0,w,h);
  let p=boxBlur(im.data,w,h);p=boxBlur(p,w,h);
  const lum=new Float32Array(w*h);
  const LV=6,step=255/(LV-1);
  for(let i=0;i<p.length;i+=4){
    let r=p[i],g=p[i+1],b=p[i+2];
    const l=0.299*r+0.587*g+0.114*b;lum[i/4]=l;
    r=l+(r-l)*1.5;g=l+(g-l)*1.5;b=l+(b-l)*1.5;        // 채도 올리기
    r=(r-128)*1.08+130;g=(g-128)*1.08+130;b=(b-128)*1.08+130; // 살짝 밝고 진하게
    p[i]=Math.round(Math.min(255,Math.max(0,r))/step)*step;   // 색 단계 단순화
    p[i+1]=Math.round(Math.min(255,Math.max(0,g))/step)*step;
    p[i+2]=Math.round(Math.min(255,Math.max(0,b))/step)*step;
  }
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){        // 소벨 외곽선
    const i=y*w+x;
    const gx=-lum[i-w-1]-2*lum[i-1]-lum[i+w-1]+lum[i-w+1]+2*lum[i+1]+lum[i+w+1];
    const gy=-lum[i-w-1]-2*lum[i-w]-lum[i-w+1]+lum[i+w-1]+2*lum[i+w]+lum[i+w+1];
    const m=Math.abs(gx)+Math.abs(gy);
    if(m>58){const f=Math.max(0.2,1-(m-58)/150),k=i*4;p[k]*=f;p[k+1]*=f;p[k+2]*=f;}
  }
  im.data.set(p);ctx.putImageData(im,0,0);
}
function onPhoto(i,inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");c.width=c.height=220;
      const s=Math.min(img.width,img.height);
      const ctx=c.getContext("2d");
      ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,220,220);
      if(S.set.toon)try{toonify(ctx,220,220)}catch(e){}
      S.girls[i].img=c.toDataURL("image/jpeg",0.88);save();renderSettings();toast(S.set.toon?"照片设置完成 — 已转为漫画风!":"照片设置完成!");
    };
    img.src=r.result;};
  r.readAsDataURL(f);inp.value="";
}

function srvUrl(){
  if(S.set.srv)return S.set.srv.replace(/\/$/,"");
  if(location.host.indexOf("appassets")>-1)return ""; // APK 내부 오리진은 서버 아님
  if(location.protocol.startsWith("http"))return location.origin;
  return "";
}
async function syncUp(silent){
  const u=srvUrl();if(!u){if(!silent)toast("请先输入服务器地址");return}
  try{
    await fetch(u+"/api/progress",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)});
    if(!silent)toast("已保存到服务器");
  }catch(e){if(!silent)toast("无法连接服务器")}
}
async function syncDown(){
  const u=srvUrl();if(!u){toast("请先输入服务器地址");return}
  try{
    const r=await fetch(u+"/api/progress");const j=await r.json();
    if(j&&j.saved){
      if(j.saved<S.saved&&!confirm("服务器数据比本机旧,仍要读取吗?"))return;
      localStorage.setItem("wonshw",JSON.stringify(j));S=load();go("home");toast("已读取服务器数据");
    }else toast("服务器上没有保存的数据");
  }catch(e){toast("无法连接服务器")}
}
async function autoSync(){
  const u=srvUrl();if(!u||!location.protocol.startsWith("http"))return;
  try{
    const r=await fetch(u+"/api/progress");const j=await r.json();
    if(j&&j.saved&&j.saved>S.saved){localStorage.setItem("wonshw",JSON.stringify(j));S=load();renderHome();toast("已与电脑进度同步")}
  }catch(e){}
}
